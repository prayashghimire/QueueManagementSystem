
services:
  postgres:
    image: postgres:15
    container_name: QueueMS-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: QueueMSdb

    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: QueueMS-redis
    ports:
    - 6379:6379
    command: redis-server --requirepass 12345

volumes:
  postgres_data: